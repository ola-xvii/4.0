format = """
$os\
$username\
$directory\
$git_branch\
$git_state\
$git_status\
$line_break\
$character"""

right_format = """
$nix_shell$docker_context\
$lua\
$nodejs\
$terraform\
$vlang\
$vagrant\
$zig\
$meson\
$python\
$golang\
$rust\
$cpp\
$c\
$cmd_duration\
"""
# right_format = """
# [](vesper)\
# $battery\
# [ ](color_pink)\
# """

palette = 'welp'

[palettes.welp]
color_fg0 = '#F8F9FA'
color_bg3 = '#665c54'
color_blue = '#00CCFF'
color_nblue = '#1BFFFF'
color_sblue = '#4682B4'
color_green = '#39FF14'
color_lgreen = '#BFFF00'
color_orange = '#FF6C00'
color_red = '#FF073A'
color_yellow = '#FFFF33'
color_pink = '#FF4DA6'
color_purple = '#E100FF'
color_black = '#000000'
color_brown = '#A3384A'
color_rust = '#B7410E'
vesper = '#FFC799'
vesper_alt = '#FFB86C'

[os]
disabled = false
style = 'fg:color_orange'

[os.symbols]
Arch = '󰣇'
OpenBSD = ''
Linux = '󰌽'
NixOS = ''
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = 'fg:color_orange'
style_root = 'fg:color_orange'
format = '[ $user ]($style)'

[directory]
style = 'bold fg:#FDFD96'
format = '[ $path ]($style)[$read_only](bold fg:#4B4B4B)'
truncation_length = 3
truncation_symbol = '…/'
read_only = '  '
home_symbol = ' '

[directory.substitutions]
'Downloads' = ' '
'Documents' = '󰈙 '
'Music' = '󰝚 '
'Pictures' = ' '
'Videos' = '󰨜 '
'Coding' = ' '
'Shared' = ' '
'Public' = ' '
'_tmp' = '󰍻 '
'tmp' = ' '

[git_branch]
symbol = ''
style = 'vesper'
format = '[ $symbol $branch]($style)'

[git_status]
style = 'vesper_alt'
format = '[ $all_status]($style) [$ahead_behind$stashed](color_green)'
conflicted = '='  
untracked = '!'  
modified  = ' '  
renamed   = '»'  
staged    = '+'  
deleted   = ' '  
stashed   = '≡'
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
up_to_date = " "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = 'color_pink'

[c]
symbol = ' '
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_sblue)]'

[cpp]
symbol = ' '
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]'

[rust]
symbol = '🦀  '
format = '[${symbol}${version}](fg:color_rust)'
detect_files = ['Cargo.toml', 'Cargo.lock', 'rustfmt.toml']
version_format = '${raw}'

[golang]
symbol = ''
format = '[ $symbol( $version)](fg:color_nblue)'

[python]
format = "[${symbol}${version}]($style)"
symbol = "[$virtualenv](bold fg:color_red) [ ⌉](bold color_blue)⌊"
version_format = "${raw}"
style = "bold color_yellow"

[docker_context]
symbol = ''
style = 'bg:color_bg3'
format = '[$symbol( $context) ](fg:#83a598 bg:color_blue)'

[nix_shell]
style = 'bold italic dimmed blue'
symbol = '✶'
format = '[$symbol nix⎪$state⎪]($style) [$name](italic dimmed white)'
impure_msg = '[⌽](bold dimmed red)'
pure_msg = '[⌾](bold dimmed green)'
unknown_msg = '[◌](bold dimmed ellow)'

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = " "
style = "bold bright-yellow"

[nodejs]
format = " [node](italic) [◫ ($version)](bold bright-green)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[cmd_duration]
format = '[ $duration](italic fg:color_fg0)'
style = 'color_green'

[character]
## success_symbol = '[❯](color_purple)'
success_symbol = " [](color_purple)"
error_symbol = " [](color_red)"
vicmd_symbol = "[  ](color_sblue)"

[battery]
unknown_symbol = ' 󰣇 '
full_symbol = '🔋'
charging_symbol = '  '
discharging_symbol = '💀'

[[battery.display]]
threshold = 30
style = 'fg:color_red'

[[battery.display]]
threshold = 60
style = 'fg:color_sblue'

[[battery.display]]
threshold = 80
style = 'fg:color_lgreen'

[[battery.display]]
threshold = 100
style = 'fg:color_nblue'
